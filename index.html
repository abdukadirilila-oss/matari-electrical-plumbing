<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MATARI ELECTRICAL AND PLUMBING Co.</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050a14;color:white;font-family:Arial;overflow:hidden;height:100vh}
#front-page{
  position:fixed; inset:0; z-index:100;
  background:radial-gradient(circle at 30% 20%,#0f2a44,#020610);
  display:flex; justify-content:center; align-items:center;
}
#front-page.hide{transform:translateY(-100%); transition:0.8s; opacity:0; pointer-events:none}
.front-box{
  text-align:center; padding:35px; width:430px; max-width:92vw;
  background:rgba(255,255,255,0.05); border:1.5px solid #00aaff;
  border-radius:22px; box-shadow:0 0 40px rgba(0,170,255,0.25); backdrop-filter:blur(10px)
}
.company-name{font-family:Arial Black; font-size:26px; color:#00aaff; text-shadow:0 0 20px #00aaff; line-height:1.2}
.company-sub{color:#ffcc00; font-size:12px; letter-spacing:3px; margin:8px 0 28px; font-weight:700}
.btn-main{width:100%; padding:17px; border-radius:14px; border:none; font-weight:900; font-size:15px; cursor:pointer; margin:7px 0}
#btnCustomer{background:#00aaff; color:white; box-shadow:0 8px 25px rgba(0,170,255,0.4)}
#btnStaff{background:transparent; border:2px solid #ff8c00; color:#ff8c00}

.modal{
  position:fixed; inset:0; z-index:200; display:none;
  background:#000; justify-content:center; align-items:center; overflow:hidden;
}
.modal.show{display:flex}
.lightning-flash{position:absolute; inset:0; background:white; opacity:0; z-index:1}
.lightning-flash.flash{animation:flashBang 0.5s ease-out}
@keyframes flashBang{0%{opacity:0} 8%{opacity:1} 18%{opacity:0.2} 28%{opacity:1} 50%{opacity:0.4} 100%{opacity:0}}
.lightning-bolt{
  position:absolute; top:-20%; left:50%; width:4px; height:0;
  background:linear-gradient(to bottom, white, #00aaff, transparent);
  box-shadow:0 0 20px white, 0 0 40px #00aaff;
  transform:translateX(-50%) rotate(-5deg); opacity:0; z-index:2;
}
.lightning-bolt.strike{animation:strikeDown 0.6s forwards}
@keyframes strikeDown{0%{height:0; opacity:0; top:-20%} 20%{opacity:1} 100%{height:130%; opacity:0; top:0}}
.thunder-text{
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) scale(0);
  font-family:Arial Black; font-size:85px; color:white;
  text-shadow:0 0 30px #00aaff, 0 0 60px white; z-index:3; opacity:0;
}
.thunder-text.boom{animation:thunderBoom 0.7s forwards}
@keyframes thunderBoom{0%{transform:translate(-50%,-50%) scale(0); opacity:0} 50%{transform:translate(-50%,-50%) scale(1.6); opacity:1} 100%{transform:translate(-50%,-50%) scale(1); opacity:0}}
.radi-word{position:absolute; top:35%; left:50%; transform:translateX(-50%); font-size:22px; color:#ffcc00; letter-spacing:8px; font-weight:900; opacity:0; z-index:3}
.radi-word.show{animation:radiShow 1s forwards 0.4s}
@keyframes radiShow{0%{opacity:0; letter-spacing:20px} 100%{opacity:1; letter-spacing:8px}}

.form-box{
  position:relative; z-index:10;
  background:linear-gradient(145deg,#111f33,#0a1426);
  border:2px solid #00aaff; width:370px; max-width:92vw;
  padding:28px; border-radius:20px; box-shadow:0 0 50px rgba(0,170,255,0.4);
  transform:scale(0) translateY(100px); opacity:0; transition:0.8s cubic-bezier(0.68,-0.55,0.265,1.55);
}
.form-box.show{transform:scale(1) translateY(0); opacity:1}
.form-box h3{color:#00aaff; text-align:center; margin-bottom:20px; font-family:Arial Black}
.form-box input{width:100%; padding:15px; margin:9px 0; border-radius:12px; border:1.5px solid #1a3a5c; background:#050a14; color:white; font-size:14px; outline:none}
.form-box input:focus{border-color:#00aaff; box-shadow:0 0 15px rgba(0,170,255,0.3)}
.btn-submit{width:100%; padding:15px; background:#00aaff; color:white; border:none; border-radius:12px; font-weight:900; margin-top:15px; cursor:pointer}
.btn-cancel{width:100%; padding:12px; background:transparent; color:#888; border:none; margin-top:8px; cursor:pointer}
.shake{animation:shakeScreen 0.6s}
@keyframes shakeScreen{0%,100%{transform:translateX(0)} 10%,30%,50%,70%,90%{transform:translateX(-10px)} 20%,40%,60%,80%{transform:translateX(10px)}}
.sound-on{position:fixed; top:15px; right:15px; z-index:101; background:rgba(0,170,255,0.2); border:1px solid #00aaff; padding:8px 12px; border-radius:20px; font-size:11px; color:#00aaff}
</style>
</head>
<body>

<div class="sound-on" id="soundStatus">🔊 SAUTI: ON</div>

<div id="front-page">
  <div class="front-box">
    <div style="font-size:55px">⚡🔧💧</div>
    <div class="company-name">MATARI ELECTRICAL AND PLUMBING Co.</div>
    <div class="company-sub">PROFESSIONAL SERVICES</div>
    <button class="btn-main" id="btnCustomer" onclick="openCustomerThunder()">👤 MTEJA - INGIA</button>
    <button class="btn-main" id="btnStaff" onclick="openStaff()">🔑 MHUDUMU - INGIA</button>
    <p style="font-size:10px; color:#00aaff; margin-top:12px">⚡ ITA PIGA RADI NA SAUTI KUBWA!</p>
  </div>
</div>

<!-- MODAL YA MTEJA NA RADI + SAUTI -->
<div class="modal" id="modalCustomer">
  <div style="position:absolute; inset:0; pointer-events:none">
    <div class="lightning-flash" id="flash"></div>
    <div class="lightning-bolt" id="bolt"></div>
    <div class="lightning-bolt" id="bolt2" style="left:45%; transform:rotate(8deg)"></div>
    <div class="lightning-bolt" id="bolt3" style="left:55%; transform:rotate(-8deg); animation-delay:0.15s"></div>
    <div class="thunder-text" id="thunderText">⚡BOOM!⚡</div>
    <div class="radi-word" id="radiWord">⚡ R A D I  K U B W A ⚡</div>
  </div>
  <div class="form-box" id="customerForm">
    <div style="text-align:center; font-size:40px">👤⚡</div>
    <h3>Karibu Mteja - Jaza Taarifa</h3>
    <input type="text" id="custName" placeholder="👤 Jina lako kamili">
    <input type="tel" id="custPhone" placeholder="📱 Namba ya Simu +255...">
    <button class="btn-submit" onclick="submitCustomer()">⚡ INGIA SASA</button>
    <button class="btn-cancel" onclick="closeAll()">GHAIRI</button>
  </div>
</div>

<div class="modal" id="modalStaff">
  <div class="form-box show" style="transform:none; opacity:1; border-color:#ff8c00">
    <div style="text-align:center; font-size:35px">🔑</div>
    <h3 style="color:#ff8c00">Mhudumu - Password</h3>
    <input type="password" id="staffPass" placeholder="🔒 Password">
    <button class="btn-submit" style="background:#ff8c00; color:black" onclick="submitStaff()">INGIA</button>
    <button class="btn-cancel" onclick="closeAll()">GHAIRI</button>
    <p style="font-size:10px; color:#666; text-align:center; margin-top:10px">Default: matari2026</p>
  </div>
</div>

<script>
// ===== SAUTI YA RADI KUBWA - WEB AUDIO API =====
let audioCtx;
function initAudio(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playThunderSound(){
  initAudio();
  let ctx = audioCtx;
  
  // 1. RADI YA KWANZA - MLIO MKUBWA WA CHINI (RUMBLE)
  for(let i=0;i<3;i++){
    let osc = ctx.createOscillator();
    let gain = ctx.createGain();
    let filter = ctx.createBiquadFilter();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(40 + Math.random()*30, ctx.currentTime + i*0.15);
    osc.frequency.exponentialRampToValueAtTime(20, ctx.currentTime + i*0.15 + 1.5);
    filter.type = 'lowpass'; filter.frequency.value = 300;
    gain.gain.setValueAtTime(0, ctx.currentTime + i*0.15);
    gain.gain.linearRampToValueAtTime(0.8, ctx.currentTime + i*0.15 + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i*0.15 + 1.8);
    osc.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
    osc.start(ctx.currentTime + i*0.15); osc.stop(ctx.currentTime + i*0.15 + 2);
  }
  
  // 2. CRACK YA UMEME - MLIO MKALI
  let crackOsc = ctx.createOscillator();
  let crackGain = ctx.createGain();
  crackOsc.type = 'square';
  crackOsc.frequency.setValueAtTime(800, ctx.currentTime);
  crackOsc.frequency.exponentialRampToValueAtTime(50, ctx.currentTime + 0.3);
  crackGain.gain.setValueAtTime(1, ctx.currentTime);
  crackGain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
  crackOsc.connect(crackGain); crackGain.connect(ctx.destination);
  crackOsc.start(); crackOsc.stop(ctx.currentTime + 0.4);
  
  // 3. WHITE NOISE KWA MVUA / RADI
  let bufferSize = ctx.sampleRate * 1.5;
  let buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  let data = buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++){ data[i] = (Math.random()*2-1) * Math.pow(1 - i/bufferSize, 2); }
  let noise = ctx.createBufferSource(); noise.buffer = buffer;
  let noiseFilter = ctx.createBiquadFilter(); noiseFilter.type='bandpass'; noiseFilter.frequency.value=800;
  let noiseGain = ctx.createGain(); noiseGain.gain.setValueAtTime(0.5, ctx.currentTime);
  noiseGain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.5);
  noise.connect(noiseFilter); noiseFilter.connect(noiseGain); noiseGain.connect(ctx.destination);
  noise.start();
}

function openCustomerThunder(){
  initAudio();
  let modal = document.getElementById('modalCustomer');
  let flash = document.getElementById('flash');
  let bolts = [document.getElementById('bolt'), document.getElementById('bolt2'), document.getElementById('bolt3')];
  let tText = document.getElementById('thunderText');
  let rWord = document.getElementById('radiWord');
  let form = document.getElementById('customerForm');
  
  modal.classList.add('show');
  form.classList.remove('show');
  
  // Reset
  flash.classList.remove('flash'); bolts.forEach(b=>b.classList.remove('strike'));
  tText.classList.remove('boom'); rWord.classList.remove('show');
  
  // VIBRATION NA SAUTI
  if(navigator.vibrate) navigator.vibrate([80,40,80,40,400]);
  playThunderSound(); // PIGA SAUTI YA RADI!
  
  setTimeout(()=>{
    flash.classList.add('flash');
    document.body.classList.add('shake');
    bolts.forEach(b=>b.classList.add('strike'));
    tText.classList.add('boom');
    rWord.classList.add('show');
    // PIGA SAUTI YA PILI
    setTimeout(()=>playThunderSound(), 300);
  },80);
  
  setTimeout(()=>{
    document.body.classList.remove('shake');
    form.classList.add('show');
  },1400);
}

function openStaff(){ document.getElementById('modalStaff').classList.add('show'); }
function closeAll(){
  document.querySelectorAll('.modal').forEach(m=>m.classList.remove('show'));
  document.getElementById('customerForm').classList.remove('show');
}
function submitCustomer(){
  let n=document.getElementById('custName').value;
  let p=document.getElementById('custPhone').value;
  if(!n||!p){ alert('Jaza jina na namba!'); return; }
  alert('Karibu '+n+' ⚡ Umeingia kwa kishindo cha radi!');
  document.getElementById('front-page').classList.add('hide');
  closeAll();
}
function submitStaff(){
  let pw=document.getElementById('staffPass').value;
  if(pw==='matari2026' || pw==='1234'){
    document.getElementById('front-page').classList.add('hide');
    closeAll();
  } else { alert('Password si sahihi!'); }
}

// Ruhusu sauti baada ya click ya kwanza (browser policy)
document.body.addEventListener('click', initAudio, {once:true});
</script>
</body>
</html>
